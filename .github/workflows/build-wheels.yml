name: Build Wheels

on:
  push:
    branches: [ python-wrapper-notebooks-tests ]
  pull_request:
    branches: [ main, python-wrapper-notebooks-tests ]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]  # Focus on Linux first for Colab support
        # Add macos-latest, windows-latest later for broader support

    steps:
      - uses: actions/checkout@v4
      
      - name: Install GSL (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgsl-dev gsl-bin
      
      - name: Install GSL (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gsl
      
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.16.5
        env:
          # Build for manylinux (Linux compatibility)
          CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-*"
          CIBW_SKIP: "*-win32 *-manylinux_i686 *-musllinux_*"
          
          # Install GSL in the manylinux container
          CIBW_BEFORE_ALL_LINUX: "yum install -y gsl-devel || apt-get install -y libgsl-dev"
          
          # Test that the wheel imports correctly
          CIBW_TEST_COMMAND: "python -c 'import magrathea; print(magrathea.__version__)'"
          
          # Build settings
          CIBW_BUILD_VERBOSITY: 1

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          retention-days: 30

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build sdist
        run: python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 30

  test_installation:
    name: Test wheel installation
    needs: [build_wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: wheels-ubuntu-latest
          path: wheelhouse
      
      - name: Install GSL
        run: |
          sudo apt-get update
          sudo apt-get install -y libgsl-dev
      
      - name: Install wheel
        run: |
          pip install wheelhouse/*.whl
      
      - name: Test import
        run: |
          python -c "import magrathea; print('Magrathea version:', magrathea.__version__)"
          python -c "from magrathea import Planet, Layer, Config; print('Successfully imported main classes')"
      
      - name: Run basic test
        run: |
          python -c "
          import magrathea as mag
          planet = mag.Planet()
          planet.add_layer('core', mass=0.33)
          planet.add_layer('mantle', mass=0.67)
          print('Created test planet:', planet.total_mass, 'Earth masses')
          "
